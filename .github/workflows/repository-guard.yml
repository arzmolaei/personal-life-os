name: Repository Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-guard:
    name: Repository foundation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repository governance
        shell: bash
        run: bash scripts/verify-repository.sh

      - name: Reject obvious WIP merge commits on main events
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git log -1 --pretty=%s | grep -Eiq '^wip([(:]|$)'; then
            echo 'WIP commit reached main.' >&2
            exit 1
          fi
